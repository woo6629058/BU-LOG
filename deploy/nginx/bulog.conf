# 운영 서버 /etc/nginx/sites-available/bulog 의 현재 설정 (certbot --nginx 적용 후 형태)
#
# 새 서버에 처음 설치할 때는 인증서 파일이 아직 없어서 이 파일을 그대로 쓰면 nginx -t 가 실패합니다.
#   1) 아래 "HTTP 전용 초기 설정"만 넣고 nginx를 reload 합니다.
#   2) certbot --nginx -d bulog.tech -d www.bulog.tech --redirect 를 실행하면
#      certbot이 443 server 블록과 HTTP → HTTPS 리다이렉트를 자동으로 추가합니다.
#
# HTTP 전용 초기 설정
#   server {
#       listen 80;
#       listen [::]:80;
#       server_name bulog.tech www.bulog.tech;
#       client_max_body_size 10m;
#       location / {
#           proxy_pass http://127.0.0.1:8080;
#           proxy_http_version 1.1;
#           proxy_set_header Host $host;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_set_header X-Forwarded-Host $host;
#       }
#   }

# HTTPS (Let's Encrypt, certbot.timer로 자동 갱신)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bulog.tech www.bulog.tech;

    ssl_certificate /etc/letsencrypt/live/bulog.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bulog.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name bulog.tech www.bulog.tech;
    return 301 https://$host$request_uri;
}
