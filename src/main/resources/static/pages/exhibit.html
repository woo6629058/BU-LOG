<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유물 소개 | BU:LOG</title>
  <!-- 피그마 글꼴: 유물 이름 Gowun Batang, 본문 Noto Sans KR (팀 공통으로 옮길지 확인 필요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/pages/exhibit.css">
  <script type="module" src="/js/pages/exhibit.js"></script>
</head>
<body class="exhibit-page">
  <!-- 공통 머리말: layout.js가 채움 (02 화면에서는 exhibit.css로 숨김, 회의에서 확인) -->
  <header id="site-header"></header>

  <main class="exhibit" id="exhibit-content" aria-live="polite">
    <!-- 상단 바: 뒤로가기 + 전시실 이름 + QR 인증 배지 -->
    <div class="exhibit-topbar">
      <a class="exhibit-back" href="/" aria-label="뒤로가기">
        <span class="exhibit-back__icon" aria-hidden="true">‹</span>
        <span id="exhibit-gallery">돌아가기</span>
      </a>
      <span class="exhibit-badge">✓ QR 인증 완료</span>
    </div>

    <!-- 유물 사진 (사진이 없으면 갈색 배경 + 안내 문구가 보임) -->
    <div class="exhibit-photo">
      <p class="exhibit-photo__placeholder">현장에서 촬영한 유물 사진</p>
      <img class="exhibit-photo__img" id="exhibit-image" alt="" hidden>
    </div>

    <!-- 태그: 전시실, 유물 번호 (API 값이 없으면 숨김) -->
    <div class="exhibit-tags">
      <span class="exhibit-tag exhibit-tag--accent" id="exhibit-gallery-tag" hidden></span>
      <span class="exhibit-tag" id="exhibit-card-no" hidden></span>
    </div>

    <!-- 유물 이름, 설명 (API 데이터로 바뀜) -->
    <h1 class="exhibit-name" id="exhibit-name">유물을 불러오고 있어요</h1>
    <p class="exhibit-description" id="exhibit-description"></p>

    <!-- 관찰 미션 박스 (질문은 퀴즈 API에서 받아서 채움) -->
    <section class="mission-box" aria-labelledby="mission-label">
      <p class="mission-box__label" id="mission-label">관찰 미션</p>
      <p class="mission-box__question" id="mission-question">전시된 유물을 직접 찾아 자세히 살펴보세요.</p>
      <p class="mission-box__note">한 번에 맞히면 황금 유물로 받아요</p>
    </section>

    <!-- 하단 고정 버튼 -->
    <div class="exhibit-cta">
      <a class="button button--primary exhibit-cta__button" id="quiz-link" href="/pages/quiz.html">미션 도전하기</a>
    </div>
  </main>

  <!-- 공통 꼬리말: layout.js가 채움 (02 화면에서는 숨김) -->
  <footer id="site-footer"></footer>
</body>
</html>
