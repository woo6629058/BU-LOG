<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유물 소개 | BU:LOG</title>
  <!-- 글꼴: 홈 화면과 같음 (Baloo 2, Noto Sans KR + CSS의 티머니 둥근바람, SUIT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@750&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/pages/exhibit.css">
  <script type="module" src="/js/pages/exhibit.js"></script>
</head>
<body class="exhibit-page">
  <!-- 공통 머리말: layout.js가 채움 (02 화면에서는 exhibit.css로 숨김) -->
  <header id="site-header"></header>

  <main class="exhibit" id="exhibit-content" aria-live="polite">
    <!-- 상단 바: 뒤로가기 + 전시실 이름 + QR 인증 배지 -->
    <div class="exhibit-topbar">
      <a class="exhibit-back" href="/" aria-label="뒤로가기">
        <span class="exhibit-back__icon" aria-hidden="true">‹</span>
        <span id="exhibit-gallery">돌아가기</span>
      </a>
      <span class="exhibit-badge">✓ QR 인증 완료</span>
    </div>

    <!-- 유물을 못 불러왔을 때만 보이는 안내 (이때 사진·태그·미션·하단 버튼은 숨김) -->
    <section class="exhibit-empty" id="exhibit-empty" hidden>
      <div class="exhibit-empty__icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="#C0603A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="27" cy="27" r="17"/>
          <path d="M40 40l14 14"/>
          <path d="M22.5 22a5 5 0 1 1 6.5 4.8c-1.3.4-2 1.4-2 2.7v.8"/>
          <circle cx="27" cy="35.5" r="0.6" fill="#C0603A"/>
        </svg>
      </div>
      <h1 class="exhibit-empty__title" id="exhibit-empty-title">유물을 찾을 수 없어요</h1>
      <p class="exhibit-empty__message" id="exhibit-empty-message"></p>
      <div class="exhibit-empty__actions">
        <a class="exhibit-empty__button exhibit-empty__button--primary" id="exhibit-empty-primary" href="/pages/qr-scan.html">QR 다시 찍기</a>
        <a class="exhibit-empty__button" href="/">홈으로</a>
      </div>
    </section>

    <!-- 유물 사진 (사진이 없으면 갈색 배경 + 안내 문구가 보임) -->
    <div class="exhibit-photo">
      <p class="exhibit-photo__placeholder">현장에서 촬영한 유물 사진</p>
      <img class="exhibit-photo__img" id="exhibit-image" alt="" hidden>
    </div>

    <!-- 태그: 전시실, 유물 번호 (API 값이 없으면 숨김) -->
    <div class="exhibit-tags">
      <span class="exhibit-tag exhibit-tag--accent" id="exhibit-gallery-tag" hidden></span>
      <span class="exhibit-tag" id="exhibit-number" hidden></span>
    </div>

    <!-- 유물 이름, 설명 (API 데이터로 바뀜) -->
    <h1 class="exhibit-name" id="exhibit-name">유물을 불러오고 있어요</h1>
    <p class="exhibit-description" id="exhibit-description"></p>
    <!-- 설명이 길면 4줄까지만 보이고 이 버튼으로 펼침 (exhibit.js가 필요할 때만 보여줌) -->
    <button class="exhibit-more" id="exhibit-more" type="button" aria-controls="exhibit-description" aria-expanded="false" hidden>더 보기</button>

    <!-- 관찰 미션 박스 (질문은 퀴즈 API에서 받아서 채움) -->
    <section class="mission-box" aria-labelledby="mission-label">
      <p class="mission-box__label" id="mission-label">관찰 미션</p>
      <p class="mission-box__question" id="mission-question">전시된 유물을 직접 찾아 자세히 살펴보세요.</p>
      <p class="mission-box__note">미션을 성공하면 그림 속 빈자리가 채워져요</p>
    </section>

    <!-- 하단 고정 버튼 -->
    <div class="exhibit-cta">
      <a class="button button--primary exhibit-cta__button" id="quiz-link" href="/pages/quiz.html">미션 도전하기</a>
    </div>
  </main>

  <!-- 공통 꼬리말: layout.js가 채움 (02 화면에서는 숨김) -->
  <footer id="site-footer"></footer>
</body>
</html>
