<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>로그인 | BU:LOG</title>
  <!-- 홈 화면과 같은 글꼴: 로고 Baloo 2, 제목 티머니 둥근바람, 라벨·버튼 SUIT, 본문 Noto Sans KR (SUIT·티머니는 auth.css에서 불러옴) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@750&family=Noto+Sans+KR:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/components/mobile-layout.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth auth--login">
    <header class="login-brand">
      <p class="login-eyebrow">부천시립박물관 유물 그림 도감</p>
      <h1 class="login-logo">BU-LOG<img src="/images/home/leaf.webp" alt="" width="107" height="94"></h1>
      <p class="login-tagline">QR을 찍고 미션을 풀어 전시실 그림을 완성해 보세요</p>
    </header>

    <form class="auth-form" id="login-form" novalidate>
      <div class="auth-fields">
        <div class="auth-field">
          <label class="visually-hidden" for="login-email">이메일 주소</label>
          <div class="auth-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <input class="auth-input" id="login-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="이메일 주소" aria-describedby="login-email-help" required>
          </div>
          <p class="auth-help" id="login-email-help" aria-live="polite"></p>
        </div>
        <div class="auth-field">
          <label class="visually-hidden" for="login-password">비밀번호</label>
          <div class="auth-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input class="auth-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" aria-describedby="login-password-help" required>
          </div>
          <p class="auth-help" id="login-password-help" aria-live="polite"></p>
        </div>
      </div>

      <div class="auth-actions">
        <p class="auth-alert" id="login-alert" role="alert"></p>
        <button class="auth-button" id="login-submit" type="submit">로그인</button>
        <ul class="auth-links">
          <li><a id="signup-link" href="/pages/terms.html"><strong>회원가입</strong></a></li>
          <li><a id="guest-link" href="/pages/guest.html">게스트로 로그인</a></li>
        </ul>
      </div>
    </form>

    <!-- 하단 박물관 언덕 그림 (꾸밈, 피그마 로그인 화면 "박물관 언덕" 2x 원본) -->
    <div class="auth-scene" aria-hidden="true">
      <img src="/images/auth/bottom-scene.webp" alt="" width="780" height="226">
    </div>
  </main>
</body>
</html>
