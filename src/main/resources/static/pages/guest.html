<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>게스트로 둘러보기 | BU:LOG</title>
  <!-- 홈 화면과 같은 글꼴: 로고 Baloo 2, 제목 티머니 둥근바람, 라벨·버튼 SUIT, 본문 Noto Sans KR (SUIT·티머니는 auth.css에서 불러옴) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@750&family=Noto+Sans+KR:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/components/mobile-layout.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/guest.js"></script>
</head>
<body class="auth-page">
  <main class="auth auth--done">
    <div class="auth-topbar">
      <a class="auth-back" id="auth-back" href="/pages/login.html" aria-label="로그인으로 돌아가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 5-7 7 7 7"/></svg>
      </a>
    </div>

    <section class="done done--guest" aria-labelledby="done-title">
      <!-- 홈 수집 현황 카드와 같은 옹기 그림 + 잎사귀 -->
      <div class="done-emblem" aria-hidden="true">
        <img class="done-emblem__art" src="/images/home/progress-jars.webp" alt="" width="204" height="144">
        <img class="done-emblem__badge done-emblem__badge--leaf" src="/images/home/leaf.webp" alt="" width="107" height="94">
      </div>
      <p class="done-badge done-badge--guest">게스트 입장</p>
      <h1 class="done-title" id="done-title">환영해요, <strong>게스트</strong> 탐험가!</h1>
      <p class="done-text">로그인하지 않아도 QR을 찍고<br>그림을 채울 수 있어요</p>
      <ul class="done-notes">
        <li>모은 유물은 지금 쓰는 이 브라우저에 기록돼요.</li>
        <li>나중에 회원가입하면 지금까지 모은 기록이 계정으로 그대로 이어져요.</li>
      </ul>
      <p class="done-start">
        <span class="done-start__number" aria-hidden="true">1</span>
        <span>
          <span class="done-start__label">추천 출발 장소</span>
          <span class="done-start__room" id="done-room">옹기1전시실부터 둘러봐요</span>
        </span>
      </p>
    </section>

    <div class="auth-actions">
      <a class="auth-button" id="done-start" href="/">탐험 시작하기</a>
      <a class="auth-text-link" href="/pages/terms.html">회원가입하고 시작하기</a>
    </div>

    <!-- 하단 박물관 언덕 그림 (꾸밈, 피그마 로그인 화면 "박물관 언덕" 2x 원본) -->
    <div class="auth-scene" aria-hidden="true">
      <img src="/images/auth/bottom-scene.webp" alt="" width="780" height="226">
    </div>
  </main>
</body>
</html>
