<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="미션을 풀어 모은 유물을 전시실별 선반에 보여 주는 BU:LOG 진열장">
  <title>진열장 | BU:LOG</title>
  <!-- 홈과 같은 글꼴: 숫자 Baloo 2, 본문 Noto Sans KR (티머니 둥근바람·SUIT는 art-theme.css에서 불러옴) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@750&family=Noto+Sans+KR:wght@600&display=swap">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/components/mobile-layout.css">
  <link rel="stylesheet" href="/css/components/tab-bar.css">
  <link rel="stylesheet" href="/css/components/art-theme.css">
  <!-- 화면 전환 방향: 새 화면이 그려지기 전에 실행돼야 해서 일반 스크립트로 불러온다 -->
  <script src="/js/common/page-transition.js"></script>
  <link rel="stylesheet" href="/css/components/artifact-figure.css">
  <link rel="stylesheet" href="/css/pages/showcase.css">
  <!-- 화면 전환 때 이어질 그림이 먼저 만들어지도록, 이 스크립트가 끝난 뒤에 화면을 그린다 -->
  <script type="module" src="/js/pages/showcase.js" blocking="render"></script>
</head>
<body class="page-art">
  <main class="showcase art-sky art-sky--branch">
    <header class="showcase__header">
      <p class="art-total">
        <span aria-hidden="true"><strong id="showcase-filled">0</strong> / <span id="showcase-total">0</span></span>
        <span class="visually-hidden" id="showcase-count-label"></span>
      </p>
      <h1 class="showcase__title">진열장</h1>
      <p class="showcase__intro">회색 유물은 전시실에서 QR을 찾아 미션을 풀면 진열돼요</p>
    </header>
    <div class="showcase__halls" id="showcase-halls"></div>
  </main>
</body>
</html>
