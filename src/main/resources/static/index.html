<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="부천시립박물관 전시실의 QR을 찍고 미션을 풀어 유물 카드를 모으는 BU:LOG">
  <title>유물 카드 탐험 | BU:LOG</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/components/tab-bar.css">
  <link rel="stylesheet" href="/css/pages/home.css">
  <script type="module" src="/js/pages/home.js"></script>
</head>
<body>
  <main class="home">
    <header class="home__header">
      <p class="home__museum">부천시립박물관</p>
      <h1 class="home__title">유물 카드 탐험</h1>
      <p class="home__intro">전시실의 QR을 찍고 미션을 풀어 유물 카드를 모아보세요</p>
    </header>

    <section class="home-progress" aria-labelledby="home-progress-label">
      <div class="home-progress__row">
        <h2 class="home-progress__label" id="home-progress-label">수집한 유물 카드</h2>
        <p class="home-progress__count">
          <span aria-hidden="true"><strong id="home-acquired">0</strong> / <span id="home-total">0</span></span>
          <span class="visually-hidden" id="home-count-label"></span>
        </p>
      </div>
      <div class="home-progress__bar" aria-hidden="true"><span id="home-progress-fill"></span></div>
      <p class="home-progress__hint" id="home-hint"></p>
    </section>

    <section class="home__rooms" aria-labelledby="home-rooms-title">
      <div class="home__section-header">
        <h2 class="home__section-title" id="home-rooms-title">전시실 세트</h2>
        <p class="home__section-meta" id="home-rooms-meta"></p>
      </div>
      <ul class="home__room-list" id="home-room-list"></ul>
    </section>
  </main>
</body>
</html>
