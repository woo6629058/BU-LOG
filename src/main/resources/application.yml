spring:
  application:
    name: BU-LOG
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  # JSON·JS·CSS·HTML을 gzip으로 줄여 보낸다 (휴대폰 데이터·로딩 시간 절약, 이미지는 이미 압축돼 있어 제외)
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,image/svg+xml
    min-response-size: 1KB
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
  security:
    # 로그인 상태 유지 쿠키 서명 키. 비어 있으면 서버가 켜질 때마다 새로 만든다 (그러면 재배포 후 다시 로그인해야 함)
    remember-me-key: ${REMEMBER_ME_KEY:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

external:
  emuseum:
    base-url: ${EMUSEUM_API_BASE_URL:http://apis.data.go.kr/1371027/openapi}
    service-key: ${EMUSEUM_API_SERVICE_KEY:}
    institution-code: ${EMUSEUM_INSTITUTION_CODE:PS01003464}
    sync-enabled: ${EMUSEUM_SYNC_ENABLED:false}
    sync-page-size: ${EMUSEUM_SYNC_PAGE_SIZE:1000}
