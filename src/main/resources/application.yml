spring:
  application:
    name: BU-LOG
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

app:
  cookie:
    secure: ${COOKIE_SECURE:false}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

external:
  emuseum:
    base-url: ${EMUSEUM_API_BASE_URL:http://apis.data.go.kr/1371027/openapi}
    service-key: ${EMUSEUM_API_SERVICE_KEY:}
    institution-code: ${EMUSEUM_INSTITUTION_CODE:PS01003464}
    sync-enabled: ${EMUSEUM_SYNC_ENABLED:false}
    sync-page-size: ${EMUSEUM_SYNC_PAGE_SIZE:1000}
